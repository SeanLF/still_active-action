name: Self-test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  green:
    name: Green fixture (no regressions, exit 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          fail-if-warning: 'true'
          bundler-audit: 'false'
      - name: Assert exit code 0
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" != "0" ]; then
            echo "::error::Expected exit-code=0 for clean fixture, got '${{ steps.run.outputs.exit-code }}'"
            exit 1
          fi

  archived:
    name: Archived fixture (regression, exit 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/archived
        run: bundle lock
      - id: run
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/archived/Gemfile
          fail-if-warning: 'true'
          bundler-audit: 'false'
      - name: Assert exit code 1
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" != "1" ]; then
            echo "::error::Expected exit-code=1 for archived fixture, got '${{ steps.run.outputs.exit-code }}'"
            exit 1
          fi

  archived-critical:
    name: Archived fixture, critical gate only (exit 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/archived
        run: bundle lock
      - id: run
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/archived/Gemfile
          # The narrower gate, which the action never exposed before. An archived
          # gem is in the critical band, so this must fail exactly as the broader
          # fail-if-warning does; what it pins down is that the flag reaches the gem
          # rather than being silently dropped.
          fail-if-critical: 'true'
          bundler-audit: 'false'
      - name: Assert exit code 1
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" != "1" ]; then
            echo "::error::Expected exit-code=1 for archived fixture under fail-if-critical, got '${{ steps.run.outputs.exit-code }}'"
            exit 1
          fi

  sarif:
    name: SARIF output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          sarif: still_active.sarif.json
          bundler-audit: 'false'
      - name: Assert SARIF file exists + has runs[]
        run: |
          test -f still_active.sarif.json
          jq -e '.runs[0].tool.driver.name == "still_active"' still_active.sarif.json
          jq -e '.version == "2.1.0"' still_active.sarif.json

  cyclonedx:
    name: CycloneDX SBOM output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          cyclonedx: still_active.cdx.json
          cyclonedx-version: '1.7'
          bundler-audit: 'false'
      - name: Assert a valid CycloneDX SBOM that honours the requested version
        run: |
          test -f still_active.cdx.json
          jq -e '.bomFormat == "CycloneDX"' still_active.cdx.json
          jq -e '.specVersion == "1.7"' still_active.cdx.json
          jq -e '(.components | length) > 0' still_active.cdx.json

  dual-source:
    name: Dual-source vulnerabilities (bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # No bundle lock here — the fixture ships a committed lockfile pinning a
      # known-vulnerable version that no longer resolves cleanly.
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/vulnerable/Gemfile
          bundler-audit: 'true'
      - name: Assert ruby-advisory-db advisories were merged in
        env:
          REPORT: ${{ steps.run.outputs.report-path }}
        run: |
          test -n "$REPORT" && test -f "$REPORT"
          jq -e '[.gems[].vulnerabilities[]?.source] | any(. == "ruby-advisory-db" or . == "merged")' "$REPORT"

  sbom:
    name: Cross-ecosystem SBOM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          sbom: fixtures/sbom/sbom.cdx.json
          bundler-audit: 'false'
          # 3.0.0 is published, so `latest` now resolves to it. Left unpinned
          # deliberately: this job is what catches the action breaking against the
          # version its users actually get by default.
      - name: Assert every fixture package was assessed across all four ecosystems
        env:
          REPORT: ${{ steps.run.outputs.report-path }}
        run: |
          test -n "$REPORT" && test -f "$REPORT"
          jq -e '.summary.total_assessed == 4' "$REPORT"
          jq -e '.summary.unassessable_count == 0' "$REPORT"
          jq -e '[.dependencies | keys[] | split("/")[0]] | unique == ["cargo", "go", "npm", "pypi"]' "$REPORT"

  sbom-cyclonedx:
    name: Enriched SBOM out (sbom + cyclonedx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          sbom: fixtures/sbom/sbom.cdx.json
          cyclonedx: enriched.cdx.json
          bundler-audit: 'false'
      - name: Assert the enriched SBOM re-emits the input's own purls
        run: |
          test -f enriched.cdx.json
          jq -e '.bomFormat == "CycloneDX"' enriched.cdx.json
          # The point of the feature: nothing is reconstructed, so every purl in
          # the output must appear verbatim in the input.
          jq -r '.components[].purl' enriched.cdx.json | sort > out.purls
          jq -r '.components[].purl' fixtures/sbom/sbom.cdx.json | sort > in.purls
          invented="$(comm -23 out.purls in.purls)"
          if [ -n "${invented}" ]; then
            echo "::error::purls in the output that were not in the input: ${invented}"
            exit 1
          fi
          # And the maintenance signals the input could not carry are attached.
          jq -e '[.components[].properties // [] | .[].name] | index("still_active:status")' enriched.cdx.json

  sbom-conflict:
    name: SBOM input conflicts fail fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - id: source
        continue-on-error: true
        uses: ./
        with:
          sbom: fixtures/sbom/sbom.cdx.json
          gemfile-path: fixtures/green/Gemfile
      - id: output-mode
        continue-on-error: true
        uses: ./
        with:
          sbom: fixtures/sbom/sbom.cdx.json
          baseline: baseline.json
      - name: Assert both conflicts failed before installing anything
        run: |
          if [ "${{ steps.source.outcome }}" != "failure" ]; then
            echo "::error::Expected sbom + gemfile-path to fail, got '${{ steps.source.outcome }}'"
            exit 1
          fi
          if [ "${{ steps.output-mode.outcome }}" != "failure" ]; then
            echo "::error::Expected sbom + baseline to fail, got '${{ steps.output-mode.outcome }}'"
            exit 1
          fi

  gates:
    name: Poison-pill + language-ceiling gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        # Either gate may legitimately trip (exit 1) as the fixture's upstreams
        # drift; what this job pins down is that still_active accepts the flags
        # and tier values the arg builder emits.
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          fail-if-poison: 'note'
          fail-if-language-ceiling: 'note'
          bundler-audit: 'false'
          # 3.0.0 is published, so `latest` resolves to it and these gates exist.
      - name: Assert the gates parsed (exit 2 means a rejected flag or tier)
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" = "2" ]; then
            echo "::error::still_active rejected a gate flag or tier value"
            exit 1
          fi
          case "${{ steps.run.outputs.exit-code }}" in
            0|1) ;;
            *)
              echo "::error::Expected exit-code 0 or 1, got '${{ steps.run.outputs.exit-code }}'"
              exit 1
              ;;
          esac

  alternatives:
    name: Alternative gem leads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/archived
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/archived/Gemfile
          alternatives: 'true'
          bundler-audit: 'false'
      - name: Assert maintained leads were attached to the archived gem
        env:
          REPORT: ${{ steps.run.outputs.report-path }}
        run: |
          test -n "$REPORT" && test -f "$REPORT"
          jq -e '.gems.nested_form.alternatives | length > 0' "$REPORT"

  cvss-suite-deprecated:
    name: cvss-suite input is a no-op on >= 3.1.0 and still installs on 3.0.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: latest
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          cvss-suite: 'true'
          bundler-audit: 'false'
      - name: Assert the deprecated input is accepted and cvss-suite came in as a dependency
        run: |
          if [ "${{ steps.latest.outputs.exit-code }}" != "0" ]; then
            echo "::error::Expected exit-code=0 with the deprecated input on latest, got '${{ steps.latest.outputs.exit-code }}'"
            exit 1
          fi
          # Dependency, not the input's install: exactly one cvss-suite, required by still_active.
          gem dependency still_active | grep -q 'cvss-suite'
      - name: Remove cvss-suite so the 3.0.x path starts from the state it targets
        run: gem uninstall still_active cvss-suite --all --executables --ignore-dependencies
      - id: pinned
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          version: '3.0.0'
          cvss-suite: 'true'
          bundler-audit: 'false'
      - name: Assert the input still installs cvss-suite for a pinned 3.0.x
        run: |
          if [ "${{ steps.pinned.outputs.exit-code }}" != "0" ]; then
            echo "::error::Expected exit-code=0 on pinned 3.0.0, got '${{ steps.pinned.outputs.exit-code }}'"
            exit 1
          fi
          gem list -i cvss-suite

  cvss-suite-deprecated-log:
    name: cvss-suite input warned on latest and installed exactly once (for 3.0.x)
    # End state alone cannot tell "warned and skipped" from "silently reinstalled"
    # (gem install is idempotent), so this reads the finished job's log.
    needs: cvss-suite-deprecated
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Assert the log of the previous job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("cvss-suite input is a no-op")) | .id')"
          test -n "${job_id}"
          gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > job.log
          test -s job.log
          # The runner echoes the action's script into the log, so the raw
          # "::warning::" and "::group::" text appears whether or not the branch ran.
          # Only an executed workflow command renders as ##[warning] / ##[group].
          warnings="$(grep -F -c '##[warning]The cvss-suite input is deprecated and did nothing' job.log || true)"
          installs="$(grep -F -c '##[group]Installing cvss-suite (CVSS 4.0 scoring' job.log || true)"
          if [ "${warnings}" != "1" ] || [ "${installs}" != "1" ]; then
            echo "::error::Expected exactly one deprecation warning (the latest run) and one cvss-suite install group (the pinned 3.0.0 run); found ${warnings} and ${installs}"
            exit 1
          fi
