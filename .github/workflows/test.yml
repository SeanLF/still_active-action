name: Self-test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  green:
    name: Green fixture (no regressions, exit 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          fail-if-warning: 'true'
          bundler-audit: 'false'
      - name: Assert exit code 0
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" != "0" ]; then
            echo "::error::Expected exit-code=0 for clean fixture, got '${{ steps.run.outputs.exit-code }}'"
            exit 1
          fi

  archived:
    name: Archived fixture (regression, exit 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/archived
        run: bundle lock
      - id: run
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/archived/Gemfile
          fail-if-warning: 'true'
          bundler-audit: 'false'
      - name: Assert exit code 1
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" != "1" ]; then
            echo "::error::Expected exit-code=1 for archived fixture, got '${{ steps.run.outputs.exit-code }}'"
            exit 1
          fi

  sarif:
    name: SARIF output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          sarif: still_active.sarif.json
          bundler-audit: 'false'
      - name: Assert SARIF file exists + has runs[]
        run: |
          test -f still_active.sarif.json
          jq -e '.runs[0].tool.driver.name == "still_active"' still_active.sarif.json
          jq -e '.version == "2.1.0"' still_active.sarif.json

  cyclonedx:
    name: CycloneDX SBOM output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          cyclonedx: still_active.cdx.json
          cyclonedx-version: '1.7'
          bundler-audit: 'false'
      - name: Assert a valid CycloneDX SBOM that honours the requested version
        run: |
          test -f still_active.cdx.json
          jq -e '.bomFormat == "CycloneDX"' still_active.cdx.json
          jq -e '.specVersion == "1.7"' still_active.cdx.json
          jq -e '(.components | length) > 0' still_active.cdx.json

  dual-source:
    name: Dual-source vulnerabilities (bundler-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # No bundle lock here — the fixture ships a committed lockfile pinning a
      # known-vulnerable version that no longer resolves cleanly.
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/vulnerable/Gemfile
          bundler-audit: 'true'
      - name: Assert ruby-advisory-db advisories were merged in
        env:
          REPORT: ${{ steps.run.outputs.report-path }}
        run: |
          test -n "$REPORT" && test -f "$REPORT"
          jq -e '[.gems[].vulnerabilities[]?.source] | any(. == "ruby-advisory-db" or . == "merged")' "$REPORT"

  sbom:
    name: Cross-ecosystem SBOM audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          sbom: fixtures/sbom/sbom.cdx.json
          bundler-audit: 'false'
          # --sbom landed in 3.0.0, still a prerelease, so `latest` (2.0.0) can't
          # run this job. Drop the pin once 3.0.0 is published non-prerelease.
          version: '3.0.0.rc6'
      - name: Assert every fixture package was assessed across all four ecosystems
        env:
          REPORT: ${{ steps.run.outputs.report-path }}
        run: |
          test -n "$REPORT" && test -f "$REPORT"
          jq -e '.summary.total_assessed == 4' "$REPORT"
          jq -e '.summary.unassessable_count == 0' "$REPORT"
          jq -e '[.dependencies | keys[] | split("/")[0]] | unique == ["cargo", "go", "npm", "pypi"]' "$REPORT"

  sbom-conflict:
    name: SBOM input conflicts fail fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - id: source
        continue-on-error: true
        uses: ./
        with:
          sbom: fixtures/sbom/sbom.cdx.json
          gemfile-path: fixtures/green/Gemfile
      - id: output-mode
        continue-on-error: true
        uses: ./
        with:
          sbom: fixtures/sbom/sbom.cdx.json
          baseline: baseline.json
      - name: Assert both conflicts failed before installing anything
        run: |
          if [ "${{ steps.source.outcome }}" != "failure" ]; then
            echo "::error::Expected sbom + gemfile-path to fail, got '${{ steps.source.outcome }}'"
            exit 1
          fi
          if [ "${{ steps.output-mode.outcome }}" != "failure" ]; then
            echo "::error::Expected sbom + baseline to fail, got '${{ steps.output-mode.outcome }}'"
            exit 1
          fi

  gates:
    name: Poison-pill + language-ceiling gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/green
        run: bundle lock
      - id: run
        # Either gate may legitimately trip (exit 1) as the fixture's upstreams
        # drift; what this job pins down is that still_active accepts the flags
        # and tier values the arg builder emits.
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/green/Gemfile
          fail-if-poison: 'note'
          fail-if-language-ceiling: 'note'
          bundler-audit: 'false'
          # Both gates landed in 3.0.0, still a prerelease, so `latest` (2.0.0)
          # would reject them. Drop the pin once 3.0.0 ships non-prerelease.
          version: '3.0.0.rc6'
      - name: Assert the gates parsed (exit 2 means a rejected flag or tier)
        run: |
          if [ "${{ steps.run.outputs.exit-code }}" = "2" ]; then
            echo "::error::still_active rejected a gate flag or tier value"
            exit 1
          fi
          case "${{ steps.run.outputs.exit-code }}" in
            0|1) ;;
            *)
              echo "::error::Expected exit-code 0 or 1, got '${{ steps.run.outputs.exit-code }}'"
              exit 1
              ;;
          esac

  alternatives:
    name: Alternative gem leads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Resolve fixture lockfile
        working-directory: fixtures/archived
        run: bundle lock
      - id: run
        uses: ./
        with:
          github-token: ${{ github.token }}
          gemfile-path: fixtures/archived/Gemfile
          alternatives: 'true'
          bundler-audit: 'false'
      - name: Assert maintained leads were attached to the archived gem
        env:
          REPORT: ${{ steps.run.outputs.report-path }}
        run: |
          test -n "$REPORT" && test -f "$REPORT"
          jq -e '.gems.nested_form.alternatives | length > 0' "$REPORT"
